name: Practice All

on: [push, workflow_dispatch]

env:
  APP_NAME: MyPythonApp
  PYTHON_VERSION: '3.12'
  TEST_MODE: development

jobs:
  job-linux:
    runs-on: ubuntu-24.04
    env:
      JOB_LEVEL: from-job
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Shell commands
        env:
          STEP_LEVEL: from-step
        run: |
          mkdir build
          echo "hello" > build/a.txt
          cp build/a.txt build/b.txt
          mv build/b.txt build/c.txt
          cat build/c.txt
          rm build/a.txt
          ls -la build
          which python
          echo "$APP_NAME / $JOB_LEVEL / $STEP_LEVEL"
      - name: Check test mode
        if: env.TEST_MODE == 'development'
        run: echo "Development mode"

  job-windows:
    runs-on: windows-latest
    steps:
      - run: echo "Runner OS is ${{ runner.os }}"
